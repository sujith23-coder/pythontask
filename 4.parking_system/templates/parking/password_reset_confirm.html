{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Set new password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/parking.css' %}">
</head>
<body class="login-hero d-flex align-items-center justify-content-center p-3">
  <div class="card login-card shadow text-dark">
    <div class="card-body p-4">
      {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Save password</button>
      </form>
      {% else %}
      <p class="text-danger">Invalid or expired link.</p>
      {% endif %}
      <a href="{% url 'parking:login' %}" class="btn btn-link btn-block">Login</a>
    </div>
  </div>
</body>
</html>
