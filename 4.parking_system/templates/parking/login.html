{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Parking Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{% static 'css/parking.css' %}">
</head>
<body class="login-hero d-flex align-items-center justify-content-center">
  <div class="w-100 px-3">
    <div class="text-center text-white mb-4">
      <h4 class="mb-0"><i class="fa fa-car text-primary"></i> Simple Parking Management System</h4>
    </div>
    <div class="card login-card shadow mx-auto">
      <div class="card-body p-4">
        <h5 class="card-title mb-4"><i class="fa fa-user-circle text-primary"></i> Admin Login</h5>
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="{% url 'parking:login' %}">
          {% csrf_token %}
          {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>
        <p class="mt-3 mb-0 small text-center"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
      </div>
    </div>
  </div>
</body>
</html>
