{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password reset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/parking.css' %}">
</head>
<body class="login-hero d-flex align-items-center justify-content-center p-3">
  <div class="card login-card shadow">
    <div class="card-body p-4 text-dark">
      <h5 class="mb-3">Reset password</h5>
      <p class="small text-muted">Enter your email. A link will be printed to the console (dev).</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <a href="{% url 'parking:login' %}" class="btn btn-link btn-block">Back to login</a>
    </div>
  </div>
</body>
</html>
