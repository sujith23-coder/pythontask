{% extends "parking/base.html" %}
{% block title %}Edit Category{% endblock %}
{% block content %}
<h4>Edit Category — {{ category.vehicle_type }}</h4>
<div class="card shadow-sm mt-3" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'parking:categories' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
